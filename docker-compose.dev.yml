services:
  postgres:
    image: postgres:16-alpine
    container_name: mmorpg-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmorpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmorpg"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: mmorpg-kafka-dev
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  shared:
    image: node:22-bookworm
    container_name: mmorpg-shared-dev
    working_dir: /workspace/shared
    environment:
      NODE_ENV: development
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    volumes:
      - .:/workspace
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/typescript/bin/tsc ]; then
          npm install --workspaces=false
        fi
        npm run build
        npm run dev

  backend:
    image: node:22-bookworm
    container_name: mmorpg-backend-dev
    restart: unless-stopped
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      shared:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mmorpg
      KAFKA_BROKERS: kafka:9092
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - backend-node-modules:/workspace/backend/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/@nestjs/cli/bin/nest.js ]; then
          npm ci --workspaces=false
        fi
        npm run start:dev

  realtime:
    image: node:22-bookworm
    container_name: mmorpg-realtime-dev
    restart: unless-stopped
    working_dir: /workspace/realtime
    depends_on:
      shared:
        condition: service_started
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 2567
      BACKEND_URL: http://backend:3000
      KAFKA_BROKERS: kafka:9092
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    ports:
      - "2567:2567"
    volumes:
      - .:/workspace
      - realtime-node-modules:/workspace/realtime/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/tsx/dist/cli.mjs ] || [ ! -f node_modules/@colyseus/playground/build/index.mjs ]; then
          npm ci --workspaces=false
        fi
        npm run start

  frontend:
    image: node:22-bookworm
    container_name: mmorpg-frontend-dev
    working_dir: /workspace/frontend
    depends_on:
      shared:
        condition: service_started
      backend:
        condition: service_started
      realtime:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 5173
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:2567
      BACKEND_INTERNAL_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
      - frontend-next:/workspace/frontend/.next
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/next/package.json ] || [ ! -f node_modules/next/dist/server/require-hook.js ]; then
          if [ -d node_modules ]; then
            find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          npm install --workspaces=false
        fi
        npm run dev

volumes:
  postgres-data:
  kafka-data:
  shared-node-modules:
  backend-node-modules:
  realtime-node-modules:
  frontend-node-modules:
  frontend-next:
