services:
  postgres:
    image: postgres:16-alpine
    container_name: mmorpg-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmorpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmorpg"]
      interval: 5s
      timeout: 5s
      retries: 10

  shared:
    image: node:22-bookworm
    container_name: mmorpg-shared-dev
    working_dir: /workspace/shared
    environment:
      NODE_ENV: development
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    volumes:
      - .:/workspace
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/typescript/bin/tsc ]; then
          npm install --workspaces=false
        fi
        npm run build
        npm run dev

  backend:
    image: node:22-bookworm
    container_name: mmorpg-backend-dev
    restart: unless-stopped
    working_dir: /workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      shared:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mmorpg
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - backend-node-modules:/workspace/backend/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/@nestjs/cli/bin/nest.js ]; then
          npm ci --workspaces=false
        fi
        npm run start:dev

  realtime:
    image: node:22-bookworm
    container_name: mmorpg-realtime-dev
    restart: unless-stopped
    working_dir: /workspace/realtime
    depends_on:
      shared:
        condition: service_started
      backend:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 2567
      BACKEND_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    ports:
      - "2567:2567"
    volumes:
      - .:/workspace
      - realtime-node-modules:/workspace/realtime/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/tsx/dist/cli.mjs ] || [ ! -f node_modules/@colyseus/playground/build/index.mjs ]; then
          npm ci --workspaces=false
        fi
        npm run start

  frontend:
    image: node:22-bookworm
    container_name: mmorpg-frontend-dev
    working_dir: /workspace/frontend
    depends_on:
      shared:
        condition: service_started
      backend:
        condition: service_started
      realtime:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 5173
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:2567
      BACKEND_INTERNAL_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
      - frontend-next:/workspace/frontend/.next
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/next/package.json ] || [ ! -f node_modules/next/dist/server/require-hook.js ]; then
          if [ -d node_modules ]; then
            find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          npm install --workspaces=false
        fi
        npm run dev

volumes:
  postgres-data:
  shared-node-modules:
  backend-node-modules:
  realtime-node-modules:
  frontend-node-modules:
  frontend-next:
