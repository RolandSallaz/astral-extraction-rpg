services:
  postgres:
    image: postgres:16-alpine
    container_name: mmorpg-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmorpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmorpg"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: mmorpg-kafka-dev
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  deps:
    image: node:22-bookworm
    container_name: mmorpg-deps-dev
    working_dir: /workspace
    environment:
      NODE_ENV: development
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - shared-node-modules:/workspace/shared/node_modules
      - backend-node-modules:/workspace/backend/node_modules
      - realtime-node-modules:/workspace/realtime/node_modules
      - frontend-node-modules:/workspace/frontend/node_modules
    command:
      - sh
      - -lc
      - |
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f1)"
        marker="node_modules/.docker-dev-package-lock"
        if [ -f "$$marker" ] && [ "$$(cat "$$marker")" = "$$lock_hash" ] \
          && [ -x shared/node_modules/.bin/tsc ] \
          && [ -x backend/node_modules/.bin/nest ] \
          && [ -x realtime/node_modules/.bin/tsx ] \
          && [ -x frontend/node_modules/.bin/next ]; then
          echo "Dependencies are current; skipping npm ci."
          exit 0
        fi
        npm ci
        echo "$$lock_hash" > "$$marker"

  shared:
    image: node:22-bookworm
    container_name: mmorpg-shared-dev
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /workspace/shared/dist/index.js && test -f /workspace/shared/dist/player/contracts.js && test -f /workspace/shared/dist/realtime/contracts.js
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 30s
    command:
      - sh
      - -lc
      - |
        rm -f shared/.docker-dev-ready
        npm run build --workspace @mmorpg/shared
        touch shared/.docker-dev-ready
        npm run dev --workspace @mmorpg/shared

  backend:
    image: node:22-bookworm
    container_name: mmorpg-backend-dev
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      shared:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mmorpg
      KAFKA_BROKERS: kafka:9092
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - backend-node-modules:/workspace/backend/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        npm run start:dev --workspace backend

  realtime:
    image: node:22-bookworm
    container_name: mmorpg-realtime-dev
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      shared:
        condition: service_healthy
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 2567
      BACKEND_URL: http://backend:3000
      KAFKA_BROKERS: kafka:9092
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_POLLINGINTERVAL: 1000
    ports:
      - "2567:2567"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - realtime-node-modules:/workspace/realtime/node_modules
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        npm run start --workspace my-app

  frontend:
    image: node:22-bookworm
    container_name: mmorpg-frontend-dev
    working_dir: /workspace
    depends_on:
      shared:
        condition: service_healthy
      backend:
        condition: service_started
      realtime:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 5173
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:2567
      BACKEND_INTERNAL_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - frontend-node-modules:/workspace/frontend/node_modules
      - frontend-next:/workspace/frontend/.next
      - shared-node-modules:/workspace/shared/node_modules
    command:
      - sh
      - -lc
      - |
        npm run dev --workspace frontend

volumes:
  postgres-data:
  kafka-data:
  root-node-modules:
  shared-node-modules:
  backend-node-modules:
  realtime-node-modules:
  frontend-node-modules:
  frontend-next:
